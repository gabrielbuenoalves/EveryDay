    cuidado: [
      { id:'pastor-home', label:'Início pastoral', title:'Início', nav:'pastor', html:`<p class="ec-kicker">Domingo, 31 de agosto</p><h3 class="ec-title">Bom dia, pastor Marcos</h3><div class="ec-card ec-card-warm"><div class="ec-row"><div><span class="ec-label">Cuidado pastoral</span><h4 style="margin-top:5px">2 pessoas aguardam retorno</h4></div><span class="ec-badge">Prioridade</span></div><div style="height:14px"></div><button class="ec-primary">Ver avisos</button></div><div class="ec-stats"><div class="ec-stat"><strong>48</strong><span>Membros</span></div><div class="ec-stat"><strong>73%</strong><span>Leitura</span></div><div class="ec-stat"><strong>3</strong><span>Grupos</span></div></div><p class="ec-section">Comunidade hoje</p><div class="ec-list"><button><span>Grupo Esperança avançou no plano<small class="ec-muted" style="display:block">há 30 minutos</small></span><i data-lucide="chevron-right"></i></button></div>` },
      { id:'mood', label:'Check-in', title:'Como você está?', nav:'none', html:`<p class="ec-kicker">Seu espaço é confidencial</p><h3 class="ec-title">Como está seu coração hoje?</h3><div class="ec-moods"><button>🤩 Grato</button><button>😢 Sozinho</button><button>😭 Triste</button><button>😩 Com pouca fé</button><button>😇 Abençoado</button><button>🤢 Doente</button><button>😀 Feliz</button><button>😍 Cuidadoso</button><button>😟 Angustiado</button></div><div class="ec-note" style="margin-top:16px">Nos sentimentos difíceis, você poderá escrever um pedido de oração e permitir contato pelo WhatsApp.</div>` },
      { id:'care-inbox', label:'Avisos', title:'Cuidado pastoral', nav:'pastor', html:`<p class="ec-kicker">Prioridades de hoje</p><h3 class="ec-title">2 pessoas aguardam cuidado</h3><div class="ec-card ec-card-warm"><div class="ec-row"><span class="ec-person"><span class="ec-avatar">AM</span><span><h4>Ana Martins</h4><p class="ec-muted">Urgência alta · hoje</p></span></span><span class="ec-badge">Novo</span></div><p style="margin:15px 0">Relatou sobrecarga e pediu uma leitura para esta semana.</p><button class="ec-primary">Revisar cuidado</button></div><div class="ec-card"><div class="ec-person"><span class="ec-avatar forest">RC</span><span><h4>Rita Costa</h4><p class="ec-muted">Acompanhamento · ontem</p></span></span></div></div>` },
      { id:'care-report', label:'Relatório', title:'Revisar cuidado', nav:'none', html:`<div class="ec-person"><span class="ec-avatar">AM</span><div><h4>Ana Martins</h4><p class="ec-muted">Relato recebido hoje</p></div></div><p class="ec-section">Relatório da IA · somente o pastor vê</p><div class="ec-card ec-card-warm"><span class="ec-badge">Urgência alta</span><p style="margin:12px 0 0">Ana relata cansaço intenso. Recomenda-se contato humano e uma leitura curta, sem sobrecarregar.</p></div><p class="ec-section">Auditar e editar antes de enviar</p><div class="ec-card"><label class="ec-field">Título do plano<input value="Uma leitura para você"></label><label class="ec-field">Mensagem do pastor<textarea>Ana, oramos por você. Revisei uma leitura para este momento. Não precisa responder — apenas receber.</textarea></label><label class="ec-field">Leituras · uma por linha<textarea>Salmos 23\nMateus 11:28–30\nIsaías 41:10</textarea></label><p class="ec-muted">A IA apenas sugere. Nada será enviado sem sua revisão e aprovação.</p><button class="ec-primary">Aprovar e enviar</button></div>` },
      { id:'insights', label:'Percepções', title:'Percepções', nav:'none', html:`<p class="ec-kicker">Ana Martins</p><h3 class="ec-title">Caminhada de cuidado</h3><div class="ec-stats"><div class="ec-stat"><strong>4/5</strong><span>Compreensão</span></div><div class="ec-stat"><strong>18 min</strong><span>Leitura</span></div><div class="ec-stat"><strong>Paz</strong><span>Recepção</span></div></div><p class="ec-section">Última reflexão</p><div class="ec-card ec-card-forest"><p>“Entendi que não preciso carregar tudo sozinha.”</p><p class="ec-muted">Plano Esperança em dias difíceis</p></div>` }
    ],
    perfil: [
      { id:'profile-member', label:'Membro', title:'Perfil', nav:'member', html:`<div class="ec-card"><div class="ec-person"><span class="ec-avatar">MA</span><div><h4>Marcos Almeida</h4><p class="ec-muted">@marcos · Membro</p></div></div><div class="ec-stats"><div class="ec-stat"><strong>7</strong><span>Sequência</span></div><div class="ec-stat"><strong>47</strong><span>Capítulos</span></div><div class="ec-stat"><strong>12</strong><span>Amigos</span></div></div><button class="ec-primary">Editar dados pessoais</button></div><p class="ec-section">Minha jornada</p><div class="ec-list"><button><span>Progresso bíblico</span><i data-lucide="chevron-right"></i></button><button><span>Planos concluídos</span><i data-lucide="chevron-right"></i></button></div>` },
      { id:'profile-pastor', label:'Pastor', title:'Perfil', nav:'pastor', html:`<p class="ec-kicker">Sua conta</p><h3 class="ec-title">Perfil pastoral</h3><div class="ec-card ec-card-warm"><div class="ec-person"><span class="ec-avatar">MA</span><div><h4>Marcos Almeida</h4><p class="ec-muted">Pastor responsável</p></div></div><div style="height:15px"></div><button class="ec-primary">Editar dados pessoais</button></div><p class="ec-section">Igreja</p><div class="ec-list"><button><span>Comunidade da Graça<small class="ec-muted" style="display:block">Dados, convite e apresentação</small></span><i data-lucide="chevron-right"></i></button></div><p class="ec-section">Administração</p><div class="ec-list"><button><span>Grupos da igreja</span><i data-lucide="chevron-right"></i></button><button><span>Preferências</span><i data-lucide="chevron-right"></i></button></div>` }
    ]
  };
  const content = root.querySelector('#ec-content');
  const pageBar = root.querySelector('.ec-pages');
  const title = root.querySelector('#ec-header-title');
  const nav = root.querySelector('#ec-nav');
  let journey = 'entrada';
  let pageId = 'login';
  let userRole = 'member';
  let toastTimer;
  const history = [];
  function navHtml(type, active) {
    if (type === 'none') return '';
    const items = type === 'pastor' ? [['home','Início'],['users','Grupos'],['bell','Avisos'],['contact','Membros'],['user','Perfil']] : [['home','Início'],['book-open','Leituras'],['users','Grupos'],['user','Perfil']];
    const activeMap = { 'feed-member':'Início', 'pastor-home':'Início', plans:'Leituras', reading:'Leituras', chapters:'Leituras', shelf:'Leituras', reflection:'Leituras', groups:'Grupos', 'group-detail':'Grupos', members:'Membros', 'care-inbox':'Avisos', 'care-report':'Avisos', insights:'Membros', 'profile-member':'Perfil', 'profile-pastor':'Perfil' };
    return items.map(([icon,label])=>`<button type="button" data-nav="${label}" class="${activeMap[pageId]===label?'is-active':''}" ${activeMap[pageId]===label?'aria-current="page"':''}><i data-lucide="${icon}" aria-hidden="true"></i><span>${label}</span></button>`).join('');
  }
  function render(id, remember = true) {
    const page = pages[journey].find(item => item.id === id) || pages[journey][0];
    if (remember && pageId !== page.id) history.push({ journey, pageId, userRole });
    pageId = page.id; title.textContent = page.title; content.innerHTML = page.html;
    if (page.nav === 'pastor') userRole = 'pastor';
    if (page.nav === 'member') userRole = 'member';
    const navType = page.nav === 'both' ? userRole : page.nav;
    nav.className = `ec-nav ${navType === 'pastor' ? 'pastor' : 'member'}`; nav.innerHTML = navHtml(navType, page.label); nav.style.display = page.nav === 'none' ? 'none' : 'grid';
    root.querySelector('#ec-back').disabled = history.length === 0;
    pageBar.querySelectorAll('button').forEach(button => { const selected = button.dataset.page === page.id; button.setAttribute('aria-selected', String(selected)); button.setAttribute('aria-pressed', String(selected)); });
    content.querySelectorAll('.ec-progress').forEach(progress => {
      const value = Number.parseInt(progress.querySelector('span')?.style.width || '0', 10);
      progress.setAttribute('role','progressbar'); progress.setAttribute('aria-label','Progresso'); progress.setAttribute('aria-valuemin','0'); progress.setAttribute('aria-valuemax','100'); progress.setAttribute('aria-valuenow', String(value));
    });
    content.querySelectorAll('.ec-moods button').forEach(button => button.setAttribute('aria-pressed','false'));
    content.querySelectorAll('i[data-lucide]').forEach(icon => icon.setAttribute('aria-hidden','true'));
    if (window.lucide) lucide.createIcons({ attrs: { width: 18, height: 18 } });
  }
  function setJourney(next, remember = true) {
    if (remember && journey !== next) history.push({ journey, pageId, userRole });
    journey = next;
    root.querySelectorAll('.ec-journeys button').forEach(button => { const selected = button.dataset.journey === next; button.setAttribute('aria-selected', String(selected)); button.setAttribute('aria-pressed', String(selected)); });
    pageBar.innerHTML = pages[next].map(page => `<button type="button" role="tab" data-page="${page.id}" aria-selected="false" aria-pressed="false">${page.label}</button>`).join('');
    pageBar.querySelectorAll('button').forEach(button => button.addEventListener('click', () => render(button.dataset.page)));
    render(pages[next][0].id, false);
  }
  root.querySelector('#ec-back').addEventListener('click', () => {
    const previous = history.pop();
    if (!previous) return;
    userRole = previous.userRole;
    setJourney(previous.journey, false);
    render(previous.pageId, false);
  });
  function go(targetJourney, targetPage) {
    const origin = { journey, pageId, userRole };
    if (origin.journey === targetJourney && origin.pageId === targetPage) return;
    history.push(origin);
    if (journey !== targetJourney) setJourney(targetJourney, false);
    render(targetPage, false);
  }
  function toast(message) {
    const element = root.querySelector('#ec-toast');
    element.textContent = message; element.classList.add('is-visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => element.classList.remove('is-visible'), 2200);
  }
  nav.addEventListener('click', event => {
    const button = event.target.closest('[data-nav]'); if (!button) return;
    const label = button.dataset.nav;
    const pastor = nav.classList.contains('pastor');
    if (label === 'Início') go(pastor ? 'cuidado' : 'membro', pastor ? 'pastor-home' : 'feed-member');
    if (label === 'Leituras') go('membro','plans');
    if (label === 'Grupos') go('comunidade','groups');
    if (label === 'Avisos') go('cuidado','care-inbox');
    if (label === 'Membros') go('comunidade','members');
    if (label === 'Perfil') go('perfil', pastor ? 'profile-pastor' : 'profile-member');
  });
  content.addEventListener('click', event => {
    const button = event.target.closest('button'); if (!button) return;
    const text = button.textContent.trim();
    if (text === 'Entrar') go('membro','feed-member');
    else if (text === 'Cadastrar igreja') { toast('Igreja criada. Código de convite disponível.'); go('perfil','profile-pastor'); }
    else if (text === 'Entrar na igreja') { toast('Você entrou na comunidade.'); go('membro','feed-member'); }
    else if (text === 'Continuar leitura' || text === 'Continuar' || text === 'Abrir leitura') go('membro','reading');
    else if (text === 'Concluir leitura') go('membro','reflection');
    else if (text === 'Concluir plano') { toast('Plano concluído com sucesso.'); go('membro','feed-member'); }
    else if (text === 'Ver grupo') go('comunidade','group-detail');
    else if (text === 'Revisar cuidado') go('cuidado','care-report');
    else if (text === 'Ver avisos') go('cuidado','care-inbox');
    else if (text === 'Aprovar e enviar') { toast('Plano revisado, enviado e aviso resolvido.'); go('cuidado','care-inbox'); }
    else if (text.includes('Editar dados pessoais')) toast('Edição de dados pessoais aberta.');
    else if (button.closest('.ec-moods')) {
      button.parentElement.querySelectorAll('button').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      const needsPrayer = ['Sozinho','Triste','Com pouca fé','Doente','Angustiado'].some(label => text.includes(label));
      toast(needsPrayer ? `${text} selecionado. Pedido de oração disponível.` : `${text} selecionado.`);
    }
    else toast(`${text || 'Ação'} selecionado.`);
  });
  root.querySelector('#ec-help').addEventListener('click', () => toast('Ajuda contextual desta página.'));
  root.querySelectorAll('.ec-theme-switch button').forEach(button => button.addEventListener('click', () => {
    const dark = button.dataset.theme === 'dark';
    root.classList.toggle('is-dark', dark);
    root.querySelectorAll('.ec-theme-switch button').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
  }));
  root.querySelectorAll('.ec-journeys button').forEach(button => { button.setAttribute('role','tab'); button.addEventListener('click', () => setJourney(button.dataset.journey)); });
  setJourney('entrada', false);
})();
</script>
